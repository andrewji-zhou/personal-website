<!doctype html>
<html lang="en" class="bg-paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Same theme setup as the main page, so this page matches the visitor's theme.
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <!-- Absolute paths (leading /): this page is served at whatever URL was missing, such as
         /a/b/c, where relative paths like ./output.css would point at the wrong place. -->
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
    <title>Page not found | Andrew Zhou</title>
    <link
      rel="preload"
      href="/fonts/source-serif-4-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body class="bg-paper text-ink">
    <main
      class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center px-6 py-12 text-center"
    >
      <img
        src="/images/404.png"
        alt="A cartoon character lying face down on the ground"
        width="928"
        height="636"
        class="w-full max-w-sm"
      />
      <h1 class="mt-8 text-3xl font-bold text-accent">404 | Page not found</h1>
      <p class="mt-3">
        Sorry, the page you were looking for couldn't be found.
      </p>
      <a
        href="/"
        class="mt-8 rounded-full bg-accent px-6 py-3 font-bold text-paper transition-opacity hover:opacity-90"
        >Back to home</a
      >
    </main>
  </body>
</html>
